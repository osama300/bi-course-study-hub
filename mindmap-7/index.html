<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Map — Data Storage for Analytics Solutions</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0f1620;
    --bg-dot: rgba(255,255,255,.05);
    --ink-node:#1e2a38;
    --ink-node-border: rgba(255,255,255,.08);
    --leaf-node:#163a30;
    --leaf-node-border: rgba(255,255,255,.08);
    --text:#f2f5f4;
    --text-soft: rgba(242,245,244,.62);
    --panel:#141c26;
    --panel-border: rgba(255,255,255,.08);

    --c1:#5C7CE0; --c2:#2FBBA0; --c3:#E08A45; --c4:#B27DD1;
    --c5:#4FA8D6; --c6:#5FC468; --c7:#8C9BC2; --c8:#E06B93;
  }

  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text); }
  body{ font-family:'IBM Plex Sans Arabic', system-ui, sans-serif; }

  .font-display{ font-family:'El Messiri','IBM Plex Sans Arabic',sans-serif; }
  .font-mono{ font-family:'IBM Plex Mono', monospace; }

  #viewport{ position:fixed; inset:0; overflow:hidden; cursor:grab; touch-action:none; }
  #viewport.grabbing{ cursor:grabbing; }
  #canvas{ position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; }

  #links-svg{ position:absolute; top:0; left:0; overflow:visible; pointer-events:none; }
  .link-path{ fill:none; stroke-width:2px; opacity:.6; }

  #nodes-layer{ position:absolute; top:0; left:0; }

  .node-box{
    position:absolute;
    box-sizing:border-box;
    border-radius:10px;
    padding:8px 12px;
    box-shadow: 0 4px 14px -6px rgba(0,0,0,.55);
    border:1px solid var(--ink-node-border);
    transform: translateY(-50%);
    transition: left .38s cubic-bezier(.4,0,.2,1), top .38s cubic-bezier(.4,0,.2,1), opacity .3s ease, box-shadow .15s ease, border-color .15s ease;
    user-select:none;
    cursor:pointer;
  }
  .node-box:hover{ border-color: var(--branch, rgba(255,255,255,.35)); }
  .node-box.is-root{ background:var(--ink-node); }
  .node-box.is-branch{ background:var(--ink-node); border-right:3px solid var(--branch); }
  .node-box.is-leaf{ background:var(--leaf-node); border-right:3px solid var(--branch); }

  /* primary = English (source terminology), secondary = Arabic translation */
  .node-primary{ font-family:'IBM Plex Sans Arabic',sans-serif; font-size:13px; font-weight:600; line-height:1.35; }
  .node-root .node-primary{ font-family:'El Messiri',sans-serif; font-size:15px; }
  .node-secondary{ font-size:11px; color:var(--text-soft); line-height:1.35; margin-top:3px; }

  .toggle-btn{
    position:absolute;
    top:50%; right:-11px;
    transform:translateY(-50%);
    width:20px; height:20px;
    border-radius:999px;
    background:var(--panel);
    border:1.5px solid var(--branch, rgba(255,255,255,.35));
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; line-height:1;
    font-family:'IBM Plex Mono',monospace;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .toggle-btn:hover{ filter:brightness(1.25); }

  .branch-1{ --branch:var(--c1); } .branch-2{ --branch:var(--c2); }
  .branch-3{ --branch:var(--c3); } .branch-4{ --branch:var(--c4); }
  .branch-5{ --branch:var(--c5); } .branch-6{ --branch:var(--c6); }
  .branch-7{ --branch:var(--c7); } .branch-8{ --branch:var(--c8); }
  .link-path{ stroke:var(--branch, #667); }

  #hud{
    position:fixed; top:16px; right:16px; z-index:10;
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:12px; padding:12px 16px; max-width:270px;
    box-shadow:0 8px 24px -8px rgba(0,0,0,.6);
  }
  #hud h1{ font-size:14px; margin:0 0 2px; }
  #hud p{ font-size:11.5px; color:var(--text-soft); margin:0; line-height:1.5; }

  #controls{
    position:fixed; bottom:16px; right:16px; z-index:10;
    display:flex; gap:8px;
  }
  .ctrl-btn{
    font-family:'IBM Plex Mono',monospace;
    background:var(--panel); border:1px solid var(--panel-border);
    color:var(--text); width:38px; height:38px; border-radius:10px;
    font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px -8px rgba(0,0,0,.6);
  }
  .ctrl-btn:hover{ border-color:rgba(255,255,255,.3); }

  #loading{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--text-soft);
  }
</style>
</head>
<body>

<div id="hud">
  <h1 class="font-display">خريطة ذهنية تفاعلية</h1>
  <p>محاضرة 7 · تخزين البيانات لحلول التحليلات<br>النص العلوي إنجليزي (المصدر)، والسفلي ترجمة عربية.<br>اسحب للتحريك، اعجل للتكبير، اضغط ⊕/⊖ لفتح أو طي فرع.</p>
</div>

<div id="controls">
  <button class="ctrl-btn" id="zoom-in" title="تكبير">+</button>
  <button class="ctrl-btn" id="zoom-out" title="تصغير">−</button>
  <button class="ctrl-btn" id="zoom-reset" title="إعادة توسيط">⤢</button>
</div>

<div id="viewport">
  <div id="canvas">
    <svg id="links-svg"></svg>
    <div id="nodes-layer"></div>
  </div>
</div>
<div id="loading">...loading map</div>

<script src="app.js"></script>
</body>
</html>
